<figure class="v-panel">
  <figcaption class="v-panel-head">
    <span class="v-panel-title">{{ .title }}</span>
    <span class="v-panel-meta">
      {{- if ne .value nil }}<span class="text-ink tabular-nums">{{ if eq .format "dur" }}{{ partial "ui/dur.html" .value }}{{ else if eq .format "pct" }}{{ partial "ui/pct.html" .value }}{{ else }}{{ partial "ui/num.html" (dict "v" .value) }}{{ end }}</span>{{ end -}}
      {{- with .series }}{{ if and (not .stale) (cond (eq ($.window | default 30) 7) .has7 .has30) }} {{ partial "ui/delta.html" (dict "cur" .cur "prev" (cond (eq ($.window | default 30) 7) .prev7 .prev30) "polarity" ($.polarity | default "none") "unit" ($.deltaUnit | default "count") "suffix" (printf "vs %dd" ($.window | default 30))) }}{{ end }}{{ end -}}
      {{- with .meta }}{{ if ne $.value nil }} · {{ end }}{{ . }}{{ end -}}
    </span>
  </figcaption>
  <div class="v-panel-body"><div class="{{ if eq .size "sm" }}v-chart-sm{{ else }}v-chart{{ end }}">
    <canvas id="{{ .id }}" data-viz="{{ .kind | default "line" }}" data-format="{{ .axis | default "number" }}"{{ if eq .zero false }} data-zero="false"{{ end }}
      data-series="{{ printf `{"labels":%s,"series":[%s]}` (jsonify (.labels | default slice)) (delimit (.datasets | default slice) ",") }}"
      role="img" aria-label="{{ .aria }}"></canvas>
  </div></div>
  <details class="v-twin"><summary>Data</summary><div></div></details>
</figure>
