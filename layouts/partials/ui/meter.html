{{- $max := float (.max | default 1) }}{{ if le $max 0.0 }}{{ $max = 1.0 }}{{ end -}}
{{- $pct := math.Min 100.0 (mul (div (float .value) $max) 100.0) -}}
<span class="v-meter{{ with .level }} is-{{ . }}{{ end }}" role="img" aria-label="{{ .label }}: {{ .value }} of {{ .max }}"><i style="--v:{{ printf "%.1f" $pct }}%"></i></span>
