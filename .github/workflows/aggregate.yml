name: Aggregate Repository Data

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aggregate-data
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.commit.outputs.changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run build

      - name: Run data aggregation
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: npm run aggregate

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run PR actionability classifier
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 scripts/pr-actionable \
            --repo typescript-sdk,python-sdk,conformance \
            --maintainers-json data/maintainers.json \
            --visr-json 'data/repos/modelcontextprotocol/{repo}/actionability.json'
          # Patch today's snapshot with .summary so sparklines see it
          for repo in typescript-sdk python-sdk conformance; do
            snap="data/repos/modelcontextprotocol/$repo/snapshots/$(date -u +%Y-%m-%d).json"
            act="data/repos/modelcontextprotocol/$repo/actionability.json"
            if [ -f "$snap" ] && [ -f "$act" ]; then
              jq --slurpfile a "$act" '.actionability = $a[0].summary' "$snap" > "$snap.tmp" && mv "$snap.tmp" "$snap"
            fi
          done

      - name: Commit and push data changes
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update repository metrics data

          Automated data sync at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main
            git push
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: aggregate
    if: needs.aggregate.outputs.changes == 'true'
    uses: ./.github/workflows/deploy.yml
