name: PyPI BigQuery

on:
  schedule:
    # Daily at 06:00 UTC — PyPI logs batch daily, intra-day runs waste quota.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bigquery
  cancel-in-progress: false

jobs:
  pypi-versions:
    name: PyPI per-version downloads
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.commit.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build

      - name: Write BigQuery credentials
        run: |
          echo '${{ secrets.BQ_KEY }}' > /tmp/bq-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/bq-key.json" >> $GITHUB_ENV

      - name: Query BigQuery
        run: npm run aggregate -- --only=bigquery

      - name: Commit and push
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update PyPI per-version download data

          Automated BigQuery sync at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin main
              git push && break
              [ $attempt -eq 3 ] && exit 1
              sleep 2
            done
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: pypi-versions
    if: needs.pypi-versions.outputs.changes == 'true'
    uses: ./.github/workflows/deploy.yml
